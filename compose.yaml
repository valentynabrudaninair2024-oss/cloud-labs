# Local stack: API + worker + MySQL + Valkey (cache) + ElasticMQ (SQS-compatible queue)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: library
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20

  app:
    build: ./app
    restart: on-failure
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      retries: 30
    environment: &app_env
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: library
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://cache:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL: ${CACHE_TTL:-45}
      QUEUE_URL: http://sqs:9324/000000000000/library-writes
      SQS_ENDPOINT_URL: http://sqs:9324
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      WORKER_DELAY_MS: ${WORKER_DELAY_MS:-200}
    depends_on: &app_deps
      db:
        condition: service_healthy
      cache:
        condition: service_started
      sqs:
        condition: service_started

  worker:
    build: ./app
    command: ["python", "worker.py"]
    restart: on-failure
    environment: *app_env
    depends_on: *app_deps

  cache:
    image: valkey/valkey:8.0-alpine

  sqs:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "9324:9324"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  db_data:
